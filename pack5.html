<div class="image-container">
    <img src="https://raw.githubusercontent.com/myhowngym/Image-4/main/IMG_7199.JPG" alt="Image Zoom" class="zoom-image">
    <div class="image-overlay"></div> <!-- Overlay avec dégradé sombre -->
    <div class="image-text">Entraînez-vous dans la zone d'entraînement équipée avec des appareils modernes.</div>
    <!-- Texte ajouté pour "Pack 5 séances" -->
    <div class="image-pack"><span class="pack">Zone d'entraînement</span></div>
</div>

<style>
    /* Conteneur d'image avec effet zoom */
    .image-container {
        position: relative;
        width: 100vw;  /* Utilise toute la largeur de la fenêtre */
        height: 10cm;   /* Hauteur fixe de 5cm */
        overflow: hidden;
    }

    /* Image qui peut être zoomée */
    .zoom-image {
        width: 100%;  /* L'image s'étendra sur toute la largeur */
        height: auto; /* Maintien de la proportion de l'image */
        object-fit: cover; /* Permet à l'image de remplir le conteneur sans la déformer */
        transition: transform 0.3s ease, filter 0.3s ease;
    }

    /* Effet de zoom au survol */
    .image-container:hover .zoom-image {
        transform: scale(1.2); /* Zoom à 120% */
        filter: brightness(50%) !important; /* Appliquer un fond mat (réduire la luminosité) au survol */
    }

    /* Overlay sombre avec dégradé sur le haut de l'image */
    .image-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 40%;  /* Ajuste la hauteur de l'overlay */
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));  /* Dégradé sombre vers transparent */
        z-index: 1;  /* S'assurer que l'overlay est au-dessus de l'image */
    }
  
 /* Texte avec fond mat qui est caché par défaut */
    .image-container .image-text {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 10px;
        text-align: center;
        color: white;
        font-family: Lato;
        font-size: 20px;
        visibility: hidden;  /* Cacher le texte par défaut */
        opacity: 0;  /* Cacher le texte par défaut */
        transition: visibility 0s, opacity 0.3s ease; /* Transition pour faire apparaître le texte */
    }
  
    /* Texte visible au survol */
    .image-container:hover .image-text {
        visibility: visible;
        opacity: 1;  /* Afficher le texte au survol */
    }

    /* Texte "Pack 5 séances" toujours visible */
    .image-pack {
        position: absolute;
        top: 20px;  /* Décale le texte vers le haut de l'image */
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: 'Lato', sans-serif;
        font-size: 40px !important;  /* Taille de police agrandie par défaut avec !important */
        font-weight: bold;
        transition: font-size 0.3s ease;  /* Transition pour l'agrandissement */
        white-space: nowrap; /* Pour que le texte reste sur une seule ligne */
        z-index: 2;  /* S'assurer que le texte est au-dessus de l'overlay */
    }

    /* Style spécifique pour chaque partie du texte */
    .image-pack .pack {
        margin-right: 3px !important; /* Un petit espace entre "Pack 5" et "Séances" */
    }

    /* Agrandissement du texte au survol (encore plus grand) */
    .image-container:hover .image-pack {
        font-size: 44px !important;  /* Agrandissement plus important au survol avec !important */
    }
</style>
